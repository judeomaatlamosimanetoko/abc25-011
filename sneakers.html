<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Sneakers | Jom's Premium Kicks</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f7f9fc;
            color: #1e293b;
            line-height: 1.5;
        }

        /* header */
        .main-header {
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1f2b3c, #e67e22);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            font-weight: 600;
            color: #334155;
            transition: 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #e67e22;
        }
        .cart-icon {
            position: relative;
        }
        .cart-count {
            background: #e67e22;
            color: white;
            font-size: 11px;
            border-radius: 30px;
            padding: 2px 7px;
            position: absolute;
            top: -8px;
            right: -12px;
        }
        .hamburger {
            display: none;
            font-size: 1.6rem;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* hero */
        .shop-hero {
            background: linear-gradient(105deg, #0f172a 0%, #1e2a3a 100%);
            padding: 3rem 2rem;
            text-align: center;
            color: white;
        }
        .shop-hero h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }
        .shop-hero p {
            opacity: 0.9;
            max-width: 550px;
            margin: 0 auto;
        }

        /* filter bar */
        .filter-bar {
            max-width: 1300px;
            margin: 1.5rem auto 0;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .filter-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .filter-group select {
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #ddd;
            background: white;
            font-family: inherit;
            font-weight: 500;
        }
        .product-count {
            font-weight: 500;
            color: #475569;
        }

        /* product grid */
        .products-grid {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .product-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            transition: 0.25s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.08);
        }
        .card-img {
            height: 260px;
            background: #f1f5f9;
            position: relative;
            overflow: hidden;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }
        .product-card:hover .card-img img {
            transform: scale(1.02);
        }
        .brand-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #e67e22;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 40px;
            text-transform: uppercase;
        }
        .card-info {
            padding: 1.2rem;
        }
        .card-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .brand-name {
            font-size: 0.7rem;
            color: #e67e22;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: capitalize;
        }
        .desc {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 14px;
        }
        .price {
            font-size: 1.3rem;
            font-weight: 800;
            color: #e67e22;
        }
        .installment {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .add-btn {
            width: 100%;
            background: #1e293b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 60px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .add-btn:hover {
            background: #e67e22;
        }

        /* empty state */
        .empty-grid {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            background: white;
            border-radius: 32px;
        }

        /* footer */
        footer {
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        /* toast */
        .toast-msg {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.25s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(120px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* responsive */
        @media (max-width: 750px) {
            .main-header {
                padding: 1rem;
            }
            .hamburger {
                display: block;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                background: white;
                padding: 1rem 0;
                gap: 1rem;
            }
            .nav-links.show {
                display: flex;
            }
            .shop-hero h1 {
                font-size: 2rem;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="logo">Jom's Sneakers</div>
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <ul class="nav-links" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="sneakers.html" class="active">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li class="cart-icon">
            <a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
            <span class="cart-count" id="cartNavCount">0</span>
        </li>
    </ul>
</header>

<section class="shop-hero">
    <h1>🔥 Fresh Kicks Collection</h1>
    <p>Authentic sneakers from top brands — grab your pair before they're gone</p>
</section>

<div class="filter-bar">
    <div class="filter-group">
        <label><i class="fas fa-tag"></i> Brand:</label>
        <select id="brandFilter">
            <option value="all">All</option>
            <option value="nike">Nike</option>
            <option value="adidas">Adidas</option>
            <option value="puma">Puma</option>
            <option value="jordan">Jordan</option>
            <option value="newbalance">New Balance</option>
        </select>
    </div>
    <div class="filter-group">
        <label><i class="fas fa-sort-amount-down"></i> Sort:</label>
        <select id="sortFilter">
            <option value="default">Featured</option>
            <option value="low-high">Price: Low → High</option>
            <option value="high-low">Price: High → Low</option>
        </select>
    </div>
    <div class="product-count" id="productCountMsg">0 products</div>
</div>

<div class="products-grid" id="productsGrid"></div>

<footer>
    <p>© 2026 Jom's Sneakers — Premium authentic footwear</p>
</footer>

<script>
    // ======================== PRODUCT DATABASE ========================
    const sneakers = [
        { id: 1, name: "Nike Air Max Dawn", brand: "nike", price: 1249, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop", desc: "Classic Air cushioning with modern upper." },
        { id: 2, name: "Adidas Ultraboost Light", brand: "adidas", price: 1599, image: "https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb?w=400&h=300&fit=crop", desc: "Responsive Boost midsole, energy return." },
        { id: 3, name: "Puma Suede XL", brand: "puma", price: 949, image: "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=400&h=300&fit=crop", desc: "Oversized suede classic, street ready." },
        { id: 4, name: "Air Jordan 1 Mid SE", brand: "jordan", price: 1799, image: "https://images.unsplash.com/photo-1539185441755-769473a23570?w=400&h=300&fit=crop", desc: "Iconic silhouette, premium leather." },
        { id: 5, name: "New Balance 550", brand: "newbalance", price: 1149, image: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400&h=300&fit=crop", desc: "Vintage basketball aesthetic." },
        { id: 6, name: "Nike Dunk Low Retro", brand: "nike", price: 1349, image: "https://images.unsplash.com/photo-1600269452121-4f2416e55c28?w=400&h=300&fit=crop", desc: "Iconic color blocking, everyday icon." },
        { id: 7, name: "Adidas Samba OG", brand: "adidas", price: 999, image: "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=400&h=300&fit=crop", desc: "Indoor soccer heritage turned streetwear." },
        { id: 8, name: "Puma RS-Z", brand: "puma", price: 1199, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop", desc: "Chunky runner with bold details." },
        { id: 9, name: "Jordan Proto-React", brand: "jordan", price: 1649, image: "https://images.unsplash.com/photo-1597045566677-9bc4a5c3bdd0?w=400&h=300&fit=crop", desc: "Lightweight React foam performance." },
        { id: 10, name: "New Balance 2002R", brand: "newbalance", price: 1499, image: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400&h=300&fit=crop", desc: "Premium comfort, refined silhouette." },
        { id: 11, name: "Nike Air Force 1 '07", brand: "nike", price: 1199, image: "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=400&h=300&fit=crop", desc: "Timeless white on white." },
        { id: 12, name: "Adidas Campus 00s", brand: "adidas", price: 1129, image: "https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb?w=400&h=300&fit=crop", desc: "Chunky skate-inspired look." }
    ];

    // Helper: Get cart from localStorage
    function getCart() {
        const cart = localStorage.getItem('jomsCart');
        return cart ? JSON.parse(cart) : [];
    }

    // Save cart + update badge
    function saveCart(cart) {
        localStorage.setItem('jomsCart', JSON.stringify(cart));
        updateCartBadge();
    }

    function updateCartBadge() {
        const cart = getCart();
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const badge = document.getElementById('cartNavCount');
        if (badge) badge.innerText = totalItems;
    }

    // Add to cart function
    function addToCart(product) {
        let cart = getCart();
        const existing = cart.find(item => item.id === product.id);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: product.price,
                quantity: 1,
                image: product.image
            });
        }
        saveCart(cart);
        showToast(`${product.name} added to cart 🛒`, '#10b981');
    }

    function showToast(msg, bg) {
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.style.backgroundColor = bg;
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2300);
    }

    // Filter + sort logic
    let currentBrand = "all";
    let currentSort = "default";

    function filterAndSortProducts() {
        let filtered = [...sneakers];
        if (currentBrand !== "all") {
            filtered = filtered.filter(p => p.brand === currentBrand);
        }
        if (currentSort === "low-high") {
            filtered.sort((a,b) => a.price - b.price);
        } else if (currentSort === "high-low") {
            filtered.sort((a,b) => b.price - a.price);
        } else {
            filtered.sort((a,b) => a.id - b.id);
        }
        return filtered;
    }

    function renderProducts() {
        const products = filterAndSortProducts();
        const container = document.getElementById('productsGrid');
        const countSpan = document.getElementById('productCountMsg');
        if (!container) return;

        if (products.length === 0) {
            container.innerHTML = `<div class="empty-grid"><i class="fas fa-shoe-prints" style="font-size: 3rem; opacity: 0.5;"></i><h3>No sneakers found</h3><p>Try a different brand filter</p></div>`;
            if (countSpan) countSpan.innerText = "0 products";
            return;
        }

        let html = '';
        for (let p of products) {
            const brandDisplay = p.brand.charAt(0).toUpperCase() + p.brand.slice(1);
            html += `
                <div class="product-card" data-id="${p.id}">
                    <div class="card-img">
                        <img src="${p.image}" alt="${p.name}" loading="lazy">
                        <div class="brand-badge">${brandDisplay}</div>
                    </div>
                    <div class="card-info">
                        <h3>${p.name}</h3>
                        <div class="brand-name"><i class="fas fa-tag"></i> ${brandDisplay}</div>
                        <div class="desc">${p.desc}</div>
                        <div class="price-row">
                            <span class="price">P${p.price.toLocaleString()}</span>
                            <span class="installment">or 3x P${Math.floor(p.price/3)}</span>
                        </div>
                        <button class="add-btn" data-id="${p.id}" data-name="${p.name.replace(/'/g, "\\'")}" data-price="${p.price}" data-img="${p.image}">
                            <i class="fas fa-cart-plus"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        if (countSpan) countSpan.innerText = `${products.length} products`;

        // Attach event listeners to each "Add to Cart" button
        document.querySelectorAll('.add-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                const name = btn.dataset.name;
                const price = parseInt(btn.dataset.price);
                const image = btn.dataset.img;
                const product = { id, name, price, image };
                addToCart(product);
            });
        });
    }

    // Event listeners for filters
    const brandSelect = document.getElementById('brandFilter');
    const sortSelect = document.getElementById('sortFilter');

    if (brandSelect) {
        brandSelect.addEventListener('change', (e) => {
            currentBrand = e.target.value;
            renderProducts();
        });
    }
    if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderProducts();
        });
    }

    // Hamburger menu (mobile)
    const hamburger = document.getElementById('hamburgerBtn');
    const navMenu = document.getElementById('navMenu');
    if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
            navMenu.classList.toggle('show');
        });
    }

    // Initial render & cart badge
    renderProducts();
    updateCartBadge();

    // sync cart across tabs
    window.addEventListener('storage', () => {
        updateCartBadge();
    });
</script>
</body>
</html>
